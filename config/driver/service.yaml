kind: Service
apiVersion: v1
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: shared-resource-csi-driver-node-cert
  name: shared-resource-csi-driver-node
  namespace: shared-resource-csi-driver
  labels:
    app: shared-resource-csi-driver-node
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app: shared-resource-csi-driver-node
  ports:
  - name: metrics
    port: 443
    protocol: TCP
    targetPort: metrics
