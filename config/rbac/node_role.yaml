apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shared-resource-csi-driver-node
rules:
  # Pod access is needed for the CSI driver to identify requesting pods
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # SharedSecrets and SharedConfigMaps are cluster-scoped resources
  - apiGroups:
      - sharedresource.openshift.io
    resources:
      - sharedconfigmaps
      - sharedsecrets
    verbs:
      - get
      - list
      - watch
  # SubjectAccessReviews are needed for RBAC permission checks
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
  # NOTE: Access to secrets and configmaps MUST be granted per-namespace
  # via Role/RoleBinding in the source namespace. See docs/rbac.md
